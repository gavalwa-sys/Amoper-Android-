name: Build AMOPER Android APK

# Builds a debug APK on every push to main and lets you trigger it manually
# from the Actions tab. No local Android Studio or SDK needed — GitHub's
# runners already have the Android SDK and a JDK preinstalled.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Provides a `gradle` command on PATH at a pinned version, so the
      # project doesn't need a committed Gradle wrapper jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: AmoperAndroid
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amoper-debug-apk
          path: AmoperAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
